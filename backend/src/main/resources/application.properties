# Server port configuration
server.port=8080

# MySQL DataSource configuration (auto-creates database employee_portal if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/employee_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# Change password to your local MySQL password if different
spring.datasource.password=root

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=500

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
